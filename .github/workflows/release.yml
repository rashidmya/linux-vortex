name: Build & Release AppImage

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab via "Run workflow").
# A tag containing a hyphen (v0.3.0-rc1, v0.0.0-ci) is published as a prerelease and does
# NOT become "latest".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the AppImage built by build.yml
        uses: actions/download-artifact@v4
        with:
          name: linux-vortex-appimage
          path: out

      - name: Classify the tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        run: |
          set -euo pipefail
          PINNED="$(tr -d '[:space:]' < pinned-commit)"
          # pinned-version only exists once we track a release tag; before the first bump
          # the pin was an untagged master commit, so fall back to the bare SHA.
          VERSION=""
          [ -f pinned-version ] && VERSION="$(tr -d '[:space:]' < pinned-version)"
          if [ -n "$VERSION" ]; then
            SOURCE_LINE="Built from upstream Vortex \`$VERSION\` (\`$PINNED\`)"
          else
            SOURCE_LINE="Built from upstream Vortex \`$PINNED\`"
          fi
          {
            echo "**UNOFFICIAL** build of [Vortex](https://github.com/Nexus-Mods/Vortex) (Nexus Mods),"
            echo "packaged as a native Linux AppImage. **Not affiliated with or endorsed by Nexus Mods.** GPL-3.0. Beta quality."
            echo ""
            echo "## Download & run"
            echo '```bash'
            echo "chmod +x linux-vortex-*-x86_64.AppImage"
            echo "./linux-vortex-*-x86_64.AppImage          # add --appimage-extract-and-run if you do not have libfuse2"
            echo '```'
            echo ""
            echo "Self-contained (bundles Electron + .NET 9). **Wine is NOT required** to run Vortex or deploy mods."
            echo "Windows game tools (script mergers, Fluffy Mod Manager, ...) are launched through the game's"
            echo "Steam Proton prefix automatically; Wine is only needed for tools of non-Steam installs."
            echo ""
            echo "$SOURCE_LINE — source: https://github.com/Nexus-Mods/Vortex/tree/$PINNED"
            echo "See \`docs/UNOFFICIAL-NOTICE.md\` for licensing/trademark details."
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: linux-vortex ${{ steps.tag.outputs.tag }} (unofficial)
          body_path: release-notes.md
          generate_release_notes: true   # append the PR changelog since the previous tag
          files: out/linux-vortex-*-x86_64.AppImage
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.make_latest }}
