name: Build & Release AppImage

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab via "Run workflow").
# A tag containing a hyphen (v0.3.0-rc1, v0.0.0-ci) is published as a prerelease and does
# NOT become "latest".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the AppImage built by build.yml
        uses: actions/download-artifact@v4
        with:
          name: linux-vortex-appimage
          path: out

      - name: Classify the tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
          fi

      # Release notes are just the generated PR changelog (grouped by label via
      # .github/release.yml). The standing "what this is / how to run it" preamble lives in
      # the README and docs/UNOFFICIAL-NOTICE.md; repeating it on every release was noise.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: linux-vortex ${{ steps.tag.outputs.tag }} (unofficial)
          generate_release_notes: true   # the PR changelog since the previous tag
          files: out/linux-vortex-*-x86_64.AppImage
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.make_latest }}
